name: test

# The workflow only checks out and tests; the default writable token is
# excess authority.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Run the test suite
        run: make test

  test-macos:
    # Covers what the Linux runners cannot: BSD userland, /bin/realpath,
    # system python3.  Both platforms are supported; neither job starts a
    # container runtime, so this proves the serializers and parsers only.
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test tools
        run: brew install shellcheck
      - name: Run the test suite
        run: make test
